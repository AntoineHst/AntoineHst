name: Metrics

on:
  # Tous les lundis à 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:
  # Régénère aussi quand on pousse sur main
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Génération des stats
        uses: lowlighter/metrics@latest
        with:
          # PAT (classic) avec scope "repo" + "read:user" — voir README setup
          token: ${{ secrets.METRICS_TOKEN }}
          user: AntoineHst
          filename: github-metrics.svg

          # Apparence
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris

          # Inclure les repos privés dans les comptes
          repositories_affiliations: owner, collaborator, organization_member
          repositories: 100

          # NB : plugin langages retiré — metrics attribue les langages par auteur
          # de commit, or les commits sont signés sous plusieurs identités git.
          # La stack est présentée explicitement via les badges du README.
